<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — CuCare</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  navy:'#0F2A4A', ink:'#0F2A4A', blue:'#1B4B8F', accent:'#2563EB',
  surface:'#F5F7FA', line:'#E2E8F0', muted:'#64748B',
  ok:'#16A34A', warn:'#D97706', bad:'#DC2626'
}}}}
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-sm">
<svg width="0" height="0" style="position:absolute">
<symbol id="i-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="17" cy="8" r="2.5"/><path d="M16 15c3 0 6 1.5 6 6"/></symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></symbol>
<symbol id="i-flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6M10 2v6l-6 11a1 1 0 0 0 1 1.5h14a1 1 0 0 0 1-1.5L14 8V2"/><path d="M7 15h10"/></symbol>
<symbol id="i-pill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/></symbol>
<symbol id="i-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8 13l-2 8 6-3 6 3-2-8"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.6-2-3.4-2.3.9a7 7 0 0 0-2.7-1.6L13.4 2h-2.8l-.4 2.7a7 7 0 0 0-2.7 1.6l-2.3-.9-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .5 0 1 .2 1.6l-2 1.6 2 3.4 2.3-.9a7 7 0 0 0 2.7 1.6l.4 2.7h2.8l.4-2.7a7 7 0 0 0 2.7-1.6l2.3.9 2-3.4-2-1.6c.2-.5.2-1 .2-1.6z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4"/><path d="M16 17l5-5-5-5"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</svg>
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-3xl grid md:grid-cols-2 card overflow-hidden shadow-sm">
    <div class="bg-navy text-white p-10 hidden md:flex flex-col justify-center gap-3">
      <div class="w-10 h-10 rounded bg-accent flex items-center justify-center"><svg class="w-5 h-5"><use href="#i-shield"/></svg></div>
      <h1 class="text-2xl font-semibold mt-2">CuCare</h1>
      <p class="text-slate-300">Saúde digital, próxima de si. Gestão institucional de processos clínicos, relatórios e documentação médica.</p>
    </div>
    <div class="p-10">
      <h2 class="text-lg font-semibold mb-1">Bem-vindo de volta</h2>
      <p class="text-muted mb-6">Aceda à sua conta para continuar</p>
      <label class="block text-xs font-medium text-muted mb-1">Email</label>
      <input class="w-full border border-line rounded px-3 py-2 mb-4 text-sm" value="carlos.mendes@hospital.ao">
      <label class="block text-xs font-medium text-muted mb-1">Palavra-passe</label>
      <div class="relative mb-2">
        <svg class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-muted"><use href="#i-lock"/></svg>
        <input type="password" class="w-full border border-line rounded pl-8 pr-3 py-2 text-sm" value="••••••••">
      </div>
      <div class="flex justify-between items-center text-xs text-muted mb-6">
        <label class="flex items-center gap-1"><input type="checkbox" checked> Lembrar sessão</label>
        <a href="recuperar-senha.html" class="text-accent">Esqueceu a palavra-passe?</a>
      </div>
      <a href="dashboard.html" class="block text-center w-full bg-accent text-white rounded py-2 font-medium hover:bg-blue">Entrar</a>
    </div>
  </div>
</div>
</body>
</html>
